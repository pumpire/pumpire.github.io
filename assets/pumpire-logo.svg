<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" fill="none">
  <title>Pumpire — from image observations to physical distance</title>
  <desc>Layered image and depth planes contain two marked pixels. Projection rays connect them to the same two points on a reconstructed triangular surface. A dark blue segment represents predicted point-pair distance, and a separate gold tape-measure reference represents physically measured ground truth.</desc>
