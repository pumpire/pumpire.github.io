      <stop stop-color="#fbfdff"/><stop offset="1" stop-color="#dcebf3"/>
    </linearGradient>
    <linearGradient id="measure-tape" x1="81" y1="108" x2="160" y2="108" gradientUnits="userSpaceOnUse">
